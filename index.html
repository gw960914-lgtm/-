<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특부후 264기 임관식 배치도</title>
    <!-- 카카오톡 미리보기 설정 -->
    <meta property="og:title" content="특부후 264기 임관식 좌석 배치도">
    <meta property="og:description" content="후보생의 교번 또는 성명을 입력하여 좌석 위치를 확인하세요.">
    <!-- https://264-wine.vercel.app/ -->
    <meta property="og:image" content="https://264-wine.vercel.app/unnamed.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- (나머지 스타일 및 스크립트는 이전과 동일) -->
    <style>
        @keyframes pulse-glow { 0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(245, 158, 11, 0.8); } 50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(245, 158, 11, 1); } }
        .highlight-seat { animation: pulse-glow 1.5s infinite; border-color: #f59e0b !important; background-color: #d97706 !important; color: #ffffff !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<!-- ...생략: 나머지 바디 내용은 이전 코드와 동일합니다... -->
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-4 sm:p-6 flex flex-col gap-6">
        <header class="text-center space-y-3 pb-5 border-b border-slate-800">
            <h1 class="text-2xl font-extrabold text-emerald-400">특부후 264기 임관식</h1>
            <div class="flex justify-center gap-2">
                <button onclick="toggleModal('notice-modal')" class="bg-amber-500/20 text-amber-300 px-3 py-1 rounded-full text-xs">안내</button>
                <button onclick="toggleViewDirection()" class="bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full text-xs">시점 전환</button>
                <button onclick="copyCurrentUrl()" class="bg-yellow-500/20 text-yellow-300 px-3 py-1 rounded-full text-xs">공유</button>
            </div>
        </header>

        <section class="bg-slate-800 p-4 rounded-xl">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <input type="text" id="search-number" placeholder="교번 예: 76" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
                <input type="text" id="search-name" placeholder="성명 예: 박철완" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            </div>
            <div class="flex gap-2">
                <button onclick="executeSearch()" class="flex-1 bg-emerald-600 py-2 rounded text-sm font-bold">조회하기</button>
                <button onclick="resetSearch()" class="bg-slate-700 px-4 py-2 rounded text-sm">초기화</button>
            </div>
        </section>

        <div id="search-result-banner" class="hidden p-3 rounded-lg text-sm text-center font-semibold"></div>

        <section class="space-y-3 text-center">
            <div class="bg-slate-100 text-slate-900 font-extrabold py-2 rounded-xl">단 상</div>
            <div id="commander-card" class="bg-slate-800 border border-emerald-500 p-2 rounded-lg cursor-pointer max-w-[150px] mx-auto text-xs" onclick="openCommanderModal()">
                <span class="text-emerald-400 font-bold">지휘자</span><br>76번 박철완
            </div>
        </section>

        <section class="border border-slate-800 bg-slate-950 p-3 rounded-xl overflow-x-auto custom-scrollbar">
            <div class="min-w-[600px]">
                <div class="grid grid-cols-[30px_repeat(8,1fr)] gap-1 mb-2 text-center text-[10px] text-slate-400">
                    <div></div><div>1열</div><div>2열</div><div>3열</div><div>4열</div><div>5열</div><div>6열</div><div>7열</div><div>8열</div>
                </div>
                <div id="seat-grid" class="grid grid-cols-[30px_repeat(8,1fr)] gap-1"></div>
            </div>
        </section>
        <button onclick="checkAdminPassword()" class="text-slate-600 text-[10px] underline">관리자 설정</button>
    </div>

    <!-- Modals -->
    <div id="detail-modal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4"><div class="bg-slate-900 rounded-2xl max-w-sm w-full p-5" id="modal-content"></div></div>
    <div id="notice-modal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4"><div class="bg-slate-900 rounded-2xl max-w-sm w-full p-5 text-sm text-slate-300 space-y-2"><p>1. 교번(예: 76) 또는 성명(예: 박철완)을 입력하시고 [조회하기] 버튼을 눌러주세요.</p><p>2. 다른 인원을 검색할 땐 반드시 [초기화] 버튼을 눌러주세요.</p><button onclick="toggleModal('notice-modal')" class="w-full bg-amber-600 text-white py-2 mt-4 rounded">확인</button></div></div>

            { number: "34", name: "김영광", note: "" }, { number: "36", name: "김원철", note: "" }, { number: "38", name: "김윤찬", note: "" }, { number: "39", name: "김인수", note: "" }, { number: "40", name: "김종빈", note: "" }, { number: "41", name: "김준권", note: "" }, { number: "43", name: "김준혁", note: "" }, { number: "44", name: "김진우", note: "" }, { number: "46", name: "김태규", note: "" }, { number: "47", name: "김태연", note: "" }, { number: "48", name: "김하진", note: "" }, { number: "49", name: "김현민", note: "" }, { number: "51", name: "김현우", note: "" }, { number: "53", name: "김현준", note: "" }, { number: "54", name: "김현준", note: "" }, { number: "55", name: "김현중", note: "" }, { number: "56", name: "나겸우", note: "" }, { number: "57", name: "나시후", note: "" }, { number: "58", name: "류호식", note: "" }, { number: "59", name: "박건욱", note: "" }, { number: "60", name: "박심윤", note: "" },
            { number: "61", name: "박상권", note: "" }, { number: "63", name: "박승태", note: "" }, { number: "64", name: "박시환", note: "" }, { number: "65", name: "박예찬", note: "" }, { number: "66", name: "박정수", note: "" }, { number: "67", name: "박제연", note: "" }, { number: "68", name: "박주성", note: "" }, { number: "69", name: "박주형", note: "" }, { number: "70", name: "박준성", note: "" }, { number: "71", name: "박중정", note: "" }, { number: "73", name: "박진응", note: "" }, { number: "75", name: "박찬민", note: "" }, { number: "77", name: "박태수", note: "" }, { number: "78", name: "박현준", note: "" }, { number: "80", name: "백승곤", note: "" }, { number: "81", name: "백승규", note: "" }, { number: "83", name: "서재경", note: "" }, { number: "84", name: "서창빈", note: "" }, { number: "85", name: "성유찬", note: "" }, { number: "86", name: "소현섭", note: "" },
            { number: "87", name: "손호민", note: "" }, { number: "88", name: "송수힌", note: "" }, { number: "89", name: "신연성", note: "" }, { number: "90", name: "신혁수", note: "" }, { number: "92", name: "안세민", note: "" }, { number: "93", name: "안창하", note: "" }, { number: "94", name: "양인권", note: "" }, { number: "97", name: "오세힌", note: "" }, { number: "98", name: "오태환", note: "" }, { number: "99", name: "오형석", note: "" }, { number: "100", name: "우림", note: "" }, { number: "101", name: "우성환", note: "" }, { number: "102", name: "유범진", note: "" }, { number: "104", name: "윤시진", note: "" }, { number: "105", name: "윤여찬", note: "" }, { number: "106", name: "윤정현", note: "" }, { number: "107", name: "윤지원", note: "" }, { number: "108", name: "윤현빈", note: "" }, { number: "109", name: "이강교", note: "" }, { number: "110", name: "이노영", note: "" }, { number: "111", name: "이도윤", note: "" },
            { number: "112", name: "이범수", note: "" }, { number: "113", name: "이성민", note: "" }, { number: "114", name: "이승민", note: "" }, { number: "115", name: "이승재", note: "" }, { number: "116", name: "이승찬", note: "" }, { number: "117", name: "이승현", note: "" }, { number: "118", name: "이연우", note: "" }, { number: "119", name: "이유승", note: "" }, { number: "120", name: "이윤호", note: "" }, { number: "121", name: "이재훈", note: "" }, { number: "122", name: "이정민", note: "" }, { number: "123", name: "이정수", note: "" }, { number: "124", name: "이종환", note: "" }, { number: "125", name: "이준성", note: "" }, { number: "127", name: "이지원", note: "" }, { number: "129", name: "이태윤", note: "" }, { number: "133", name: "장한빈", note: "" }, { number: "134", name: "점종훈", note: "" }, { number: "135", name: "정규현", note: "" }, { number: "137", name: "정무경", note: "" }, { number: "138", name: "정서헌", note: "" },
            { number: "139", name: "정성우", note: "" }, { number: "140", name: "정준호", note: "" }, { number: "141", name: "정지오", note: "" }, { number: "142", name: "정창민", note: "" }, { number: "143", name: "정형관", note: "" }, { number: "144", name: "조도연", note: "" }, { number: "145", name: "조범주", note: "" }, { number: "146", name: "조우빈", note: "" }, { number: "147", name: "조형태", note: "" }, { number: "148", name: "주관영", note: "" }, { number: "149", name: "천원희", note: "" }, { number: "151", name: "최승훈", note: "" }, { number: "152", name: "최용준", note: "" }, { number: "153", name: "최우빈", note: "" }, { number: "154", name: "최윤우", note: "" }, { number: "157", name: "최정현", note: "" }, { number: "159", name: "최지호", note: "" }, { number: "161", name: "최호준", note: "" }, { number: "162", name: "하은율", note: "" }, { number: "163", name: "한대희", note: "" }, { number: "164", name: "한신혁", note: "" },
            { number: "165", name: "한영민", note: "" }, { number: "167", name: "한태영", note: "" }, { number: "170", name: "홍지현", note: "" }, { number: "171", name: "홍현호", note: "" }, { number: "172", name: "황태빈", note: "" }, { number: "174", name: "강지우", note: "" }, { number: "175", name: "강민아", note: "" }, { number: "176", name: "고준우", note: "" }, { number: "178", name: "김솔민", note: "" }, { number: "181", name: "김지민", note: "" }, { number: "183", name: "박인혁", note: "" }, { number: "184", name: "송연우", note: "" }, { number: "185", name: "신승기", note: "" }, { number: "186", name: "오서준", note: "" }, { number: "187", name: "이도현", note: "" }, { number: "188", name: "이민성", note: "" }, { number: "189", name: "임종화", note: "" }, { number: "190", name: "장민성", note: "" }, { number: "191", name: "전창현", note: "" }, { number: "192", name: "정정훈", note: "" }, { number: "194", name: "최우진", note: "" },
            { number: "195", name: "최준혁", note: "" }, { number: "196", name: "홍준혁", note: "" }, { number: "197", name: "김건하", note: "" }, { number: "198", name: "김남운", note: "" }, { number: "200", name: "김상현", note: "" }, { number: "202", name: "남두환", note: "" }, { number: "205", name: "박지원", note: "" }, { number: "206", name: "변승우", note: "" }, { number: "208", name: "오준영", note: "" }, { number: "211", name: "이강", note: "" }, { number: "212", name: "이정규", note: "" }, { number: "214", name: "이진우", note: "" }, { number: "216", name: "이한빈", note: "" }, { number: "218", name: "임철희", note: "" }, { number: "219", name: "정다훈", note: "" }, { number: "221", name: "지승효", note: "" }, { number: "224", name: "최효명", note: "" }
        ];
        let isParentView = true;

        function renderBoard() {
            const seatGrid = document.getElementById('seat-grid');
            seatGrid.innerHTML = '';
            const gridMap = traineesData.map((t, i) => ({ ...t, col: Math.floor(i / 21) + 1, row: (i % 21) + 1 }));
            for (let r = 1; r <= TOTAL_ROWS; r++) {
                const rowLabel = document.createElement('div'); rowLabel.className = "text-[9px] flex items-center justify-center text-slate-500"; rowLabel.innerText = `${r}행`; seatGrid.appendChild(rowLabel);
                for (let c = 1; c <= TOTAL_COLS; c++) {
                    const colIndex = isParentView ? c : (TOTAL_COLS - c + 1);
                    const person = gridMap.find(t => t.col === colIndex && t.row === r);
                    const seatBtn = document.createElement('button');
                    const echelonBg = (colIndex <= 4) ? 'bg-purple-950/60' : 'bg-emerald-950/60';
                    if (person) {
                        seatBtn.className = `p-1 rounded border text-center ${echelonBg} border-slate-700`;
                        seatBtn.onclick = () => openDetailModal(person);
                        seatBtn.id = `seat-${colIndex}-${r}`;
                        seatBtn.innerHTML = `<span class="block text-[8px] text-slate-400">${person.number}</span><span class="text-[10px] font-bold">${person.name}</span>`;
                    } else { seatBtn.className = "bg-slate-900 border border-slate-800 rounded"; seatBtn.disabled = true; }
                    seatGrid.appendChild(seatBtn);
                }
            }
        }

        function executeSearch() {
            const n = document.getElementById('search-number').value, m = document.getElementById('search-name').value;
            if (n === "76" || m.includes("박철완")) { document.getElementById('commander-card').scrollIntoView({behavior:'smooth'}); alert("지휘자 박철완입니다."); return; }
            const match = traineesData.map((t, i) => ({ ...t, col: Math.floor(i / 21) + 1, row: (i % 21) + 1 })).find(t => (n && t.number === n) || (m && t.name.includes(m)));
            if (match) {
                const target = document.getElementById(`seat-${isParentView ? match.col : (TOTAL_COLS - match.col + 1)}-${match.row}`);
                target.classList.add('highlight-seat'); target.scrollIntoView({behavior:'smooth'});
                document.getElementById('search-result-banner').innerHTML = `[${match.number}번 ${match.name}] 위치: ${match.col}열 ${match.row}행 <br> 비고: ${match.note || '없음'}`; document.getElementById('search-result-banner').classList.remove('hidden');
            } else alert("못 찾았습니다.");
        }

        function openAdminModal() {
            document.getElementById('modal-content').innerHTML = `<h3 class='text-white font-bold mb-2'>명단 관리</h3><div class='max-h-60 overflow-y-auto space-y-1 mb-4' id='admin-list'>${traineesData.map((t, i) => `<div class='flex gap-1'><input class='w-10 bg-slate-800 p-1 text-[10px] text-white' value='${t.number}' id='n-${i}'><input class='flex-1 bg-slate-800 p-1 text-[10px] text-white' value='${t.name}' id='m-${i}'><input class='w-16 bg-slate-800 p-1 text-[10px] text-white' value='${t.note || ''}' id='o-${i}' placeholder='비고'><button onclick='del(${i})' class='bg-red-900 px-2 text-white'>X</button></div>`).join('')}</div><button onclick='add()' class='w-full bg-blue-600 py-1 text-sm'>+ 인원 추가</button><button onclick='save()' class='w-full bg-emerald-600 py-1 mt-2 text-sm'>저장</button>`;
            document.getElementById('detail-modal').classList.remove('hidden');
        }
        function del(i) { traineesData.splice(i, 1); openAdminModal(); }
        function add() { traineesData.push({number: "0", name: "신규", note: ""}); openAdminModal(); }
        function save() { traineesData.forEach((_, i) => { traineesData[i].number = document.getElementById('n-'+i).value; traineesData[i].name = document.getElementById('m-'+i).value; traineesData[i].note = document.getElementById('o-'+i).value; }); localStorage.setItem('traineeList', JSON.stringify(traineesData)); location.reload(); }
        
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function toggleViewDirection() { isParentView = !isParentView; renderBoard(); }
        function resetSearch() { document.querySelectorAll('.highlight-seat').forEach(e => e.classList.remove('highlight-seat')); document.getElementById('search-result-banner').classList.add('hidden'); }
        function copyCurrentUrl() { navigator.clipboard.writeText(window.location.href); alert("링크 복사 완료"); }
        function checkAdminPassword() { if(prompt("비밀번호")==="1989") openAdminModal(); }
        function openCommanderModal() { alert("지휘자: 박철완 (76번)"); }
        function openDetailModal(p) { toggleModal('detail-modal'); document.getElementById('modal-content').innerHTML = `<p class="text-white font-bold">${p.number}번 ${p.name}</p><p class="text-slate-400 text-sm mt-2">비고: ${p.note || '없음'}</p><button onclick="toggleModal('detail-modal')" class="mt-4 w-full bg-slate-700 py-2 rounded">닫기</button>`; }
        window.onload = renderBoard;
    </script>
</body>
</html>
