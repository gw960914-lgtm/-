        }
        .highlight-seat {
            animation: pulse-glow 1.5s infinite;

            background-color: #d97706 !important;
            color: #ffffff !important;
            z-index: 20;
        }
        .selected-swap {
            border-color: #3b82f6 !important;
            background-color: #1e3a8a !important;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            z-index: 15;
        }
        .drag-over {
            border-color: #10b981 !important;
            background-color: #064e3b !important;
            transform: scale(1.06);
        }
        .dragging-source { opacity: 0.35; }
        .mobile-drag-clone {
            position: fixed; z-index: 99999; pointer-events: none; opacity: 0.92;

        }

        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }

            { col: 1, row: 10, number: "208", name: "오준영", note: "" }, { col: 2, row: 10, number: "211", name: "이강", note: "" }, { col: 3, row: 10, number: "212", name: "이정규", note: "" }, { col: 4, row: 10, number: "214", name: "이진우", note: "" }, { col: 5, row: 10, number: "216", name: "이한빈", note: "" }, { col: 6, row: 10, number: "218", name: "임철희", note: "" }, { col: 7, row: 10, number: "219", name: "정다훈", note: "" }, { col: 8, row: 10, number: "221", name: "지승효", note: "" },
            { col: 1, row: 11, number: "224", name: "최효명", note: "" }
        ];
    </script>

    <script>
        const ADMIN_PW = "1989";
        const TOTAL_ROWS = 11;
        
        // 1, 2제대를 독립적으로 관리하는 배열로 통합 (echelon 속성 추가)
        let traineesData = JSON.parse(localStorage.getItem('traineeList_264')) || [
            ...echelon1Data.map(t => ({ ...t, echelon: 1 })),
            ...echelon2Data.map(t => ({ ...t, echelon: 2 }))
        ];

        let isDragMode = false;
        let selectedSeatForSwap = null;
        let draggedSeatSource = null;
        
        let mobileTouchSrc = null;
        let mobileClone = null;
        let mobileDropTarget = null;

        function requestDragModeToggle() {
            if (!isDragMode) {
                if (prompt("관리자 비밀번호:") === ADMIN_PW) setDragMode(true);
                else alert("비밀번호 불일치");
            } else setDragMode(false);
        }

        function setDragMode(enable) {
            isDragMode = enable; selectedSeatForSwap = null;
            const btn = document.getElementById('drag-toggle-btn');
            const msg = document.getElementById('drag-status-msg');
            if (enable) {
                btn.className = "bg-sky-500 text-white font-bold text-xs px-3 py-1.5 rounded-full animate-pulse";
                btn.innerText = "🖐️ 자리 이동 모드: ON (터치/드래그)";
                msg.classList.remove('hidden');
            } else {
                btn.className = "bg-sky-500/20 text-sky-300 text-xs px-3 py-1.5 rounded-full";
                btn.innerText = "🖐️ 자리 이동 모드: OFF";
                msg.classList.add('hidden');
            }
            renderBoard();
        }

        function renderBoard() {
            renderEchelon(1, 'echelon1-grid', 'echelon1-headers');
            renderEchelon(2, 'echelon2-grid', 'echelon2-headers');
        }

        function renderEchelon(echelonNum, gridId, headerId) {
            const gridElem = document.getElementById(gridId);
            const headerElem = document.getElementById(headerId);
            gridElem.innerHTML = ''; headerElem.innerHTML = '<div></div>';
            
            for (let c = 1; c <= 8; c++) headerElem.innerHTML += `<div>${c}열</div>`;

            for (let r = 1; r <= TOTAL_ROWS; r++) {
                const rowLabel = document.createElement('div');
                rowLabel.className = "text-[9px] flex items-center justify-center text-slate-500 font-mono";
                rowLabel.innerText = `${r}행`;
                gridElem.appendChild(rowLabel);

                for (let c = 1; c <= 8; c++) {
                    const person = traineesData.find(t => t.echelon === echelonNum && t.col === c && t.row === r);
                    const seatBtn = document.createElement('button');
                    const echelonBg = (echelonNum === 1) ? 'bg-purple-950/60' : 'bg-emerald-950/60';
                    
                    seatBtn.dataset.echelon = echelonNum;
                    seatBtn.dataset.col = c;
                    seatBtn.dataset.row = r;
                    seatBtn.id = `seat-${echelonNum}-${c}-${r}`;

                    if (person) {
                        const isSel = selectedSeatForSwap && selectedSeatForSwap.echelon === echelonNum && selectedSeatForSwap.col === c && selectedSeatForSwap.row === r;
                        seatBtn.className = `p-1 rounded border text-center min-h-[38px] transition ${isSel ? 'selected-swap' : echelonBg} border-slate-700`;
                        seatBtn.innerHTML = `<span class="block text-[8px] text-slate-400 font-mono">${person.number}</span><span class="font-bold text-slate-100 text-[10px]">${person.name}</span>`;
                        if (isDragMode) {
                            seatBtn.draggable = true;
                            seatBtn.ondragstart = (e) => handleDesktopDragStart(e, echelonNum, c, r);
                            seatBtn.ondragover = (e) => handleDesktopDragOver(e, seatBtn);
                            seatBtn.ondragleave = () => seatBtn.classList.remove('drag-over');
                            seatBtn.ondrop = (e) => handleDesktopDrop(e, echelonNum, c, r, seatBtn);
                            bindMobileTouch(seatBtn, echelonNum, c, r);
                        }
                        seatBtn.onclick = () => isDragMode ? handleSeatClickForSwap(echelonNum, c, r) : openDetailModal(person);
                    } else {
                        seatBtn.className = "bg-slate-900/40 border border-slate-800/80 rounded min-h-[38px]";
                        if (isDragMode) {
                            seatBtn.ondragover = (e) => handleDesktopDragOver(e, seatBtn);
                            seatBtn.ondragleave = () => seatBtn.classList.remove('drag-over');
                            seatBtn.ondrop = (e) => handleDesktopDrop(e, echelonNum, c, r, seatBtn);
                            bindMobileTouch(seatBtn, echelonNum, c, r);
                        }
                        seatBtn.onclick = () => isDragMode && selectedSeatForSwap ? handleSeatClickForSwap(echelonNum, c, r) : null;
                    }
                    gridElem.appendChild(seatBtn);
                }
            }
        }

        // --- 터치 및 드래그 로직 ---
        function bindMobileTouch(elem, ech, col, row) {
            elem.addEventListener("touchstart", function (e) {
                if (!isDragMode) return;
                const person = traineesData.find(t => t.echelon === ech && t.col === col && t.row === row);
                if (!person && !selectedSeatForSwap) return;
                mobileTouchSrc = { ech, col, row, element: this };
                const touch = e.touches[0];
                mobileClone = this.cloneNode(true);
                mobileClone.className = "mobile-drag-clone";
                mobileClone.style.width = this.offsetWidth + "px"; mobileClone.style.height = this.offsetHeight + "px";
                mobileClone.style.left = (touch.clientX - this.offsetWidth / 2) + "px"; mobileClone.style.top = (touch.clientY - this.offsetHeight / 2) + "px";
                document.body.appendChild(mobileClone);
                this.classList.add("dragging-source");
            }, { passive: true });

            elem.addEventListener("touchmove", function (e) {
                if (!isDragMode || !mobileTouchSrc || !mobileClone) return;
                const touch = e.touches[0];
                mobileClone.style.left = (touch.clientX - mobileClone.offsetWidth / 2) + "px"; mobileClone.style.top = (touch.clientY - mobileClone.offsetHeight / 2) + "px";
                const underElem = document.elementFromPoint(touch.clientX, touch.clientY);
                const targetBtn = underElem ? underElem.closest("button[data-echelon]") : null;
                document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
                if (targetBtn && targetBtn !== mobileTouchSrc.element) { targetBtn.classList.add("drag-over"); mobileDropTarget = targetBtn; }
                else mobileDropTarget = null;
                if (e.cancelable) e.preventDefault();
            }, { passive: false });

            elem.addEventListener("touchend", function () {
                if (!isDragMode || !mobileTouchSrc) return;
                if (mobileClone) { mobileClone.remove(); mobileClone = null; }
                if (mobileTouchSrc.element) mobileTouchSrc.element.classList.remove("dragging-source");
                document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
                if (mobileDropTarget) {
                    const tEch = parseInt(mobileDropTarget.dataset.echelon), tCol = parseInt(mobileDropTarget.dataset.col), tRow = parseInt(mobileDropTarget.dataset.row);
                    if (tEch && tCol && tRow && (mobileTouchSrc.ech !== tEch || mobileTouchSrc.col !== tCol || mobileTouchSrc.row !== tRow)) {
                        swapOrMoveSeat(mobileTouchSrc.ech, mobileTouchSrc.col, mobileTouchSrc.row, tEch, tCol, tRow);
                    }
                }
                mobileTouchSrc = null; mobileDropTarget = null;
            });
        }

        function handleDesktopDragStart(e, ech, col, row) {
            if (!isDragMode) return;
            draggedSeatSource = { ech, col, row };
            e.dataTransfer.setData('text/plain', JSON.stringify({ ech, col, row }));
            e.dataTransfer.effectAllowed = 'move';
        }
        function handleDesktopDragOver(e, elem) { if (!isDragMode) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; elem.classList.add('drag-over'); }
        function handleDesktopDrop(e, tEch, tCol, tRow, elem) {
            if (!isDragMode) return; e.preventDefault(); elem.classList.remove('drag-over');
            let src = draggedSeatSource;
            if (!src) { try { src = JSON.parse(e.dataTransfer.getData('text/plain')); } catch(err) { return; } }
            if (src && (src.ech !== tEch || src.col !== tCol || src.row !== tRow)) swapOrMoveSeat(src.ech, src.col, src.row, tEch, tCol, tRow);
            draggedSeatSource = null;
        }
        function handleSeatClickForSwap(ech, col, row) {
            if (!selectedSeatForSwap) {
                if (traineesData.find(t => t.echelon === ech && t.col === col && t.row === row)) { selectedSeatForSwap = { ech, col, row }; renderBoard(); }
            } else {
                if (selectedSeatForSwap.ech !== ech || selectedSeatForSwap.col !== col || selectedSeatForSwap.row !== row) swapOrMoveSeat(selectedSeatForSwap.ech, selectedSeatForSwap.col, selectedSeatForSwap.row, ech, col, row);
                selectedSeatForSwap = null; renderBoard();
            }
        }

        function swapOrMoveSeat(sEch, sCol, sRow, tEch, tCol, tRow) {
            const srcPerson = traineesData.find(t => t.echelon === sEch && t.col === sCol && t.row === sRow);
            const tarPerson = traineesData.find(t => t.echelon === tEch && t.col === tCol && t.row === tRow);
            if (!srcPerson) return;
            if (tarPerson) {
                srcPerson.echelon = tEch; srcPerson.col = tCol; srcPerson.row = tRow;
                tarPerson.echelon = sEch; tarPerson.col = sCol; tarPerson.row = sRow;
            } else { srcPerson.echelon = tEch; srcPerson.col = tCol; srcPerson.row = tRow; }
            localStorage.setItem('traineeList_264', JSON.stringify(traineesData));
            renderBoard();
        }

        function executeSearch() {
            const n = document.getElementById('search-number').value.trim(), m = document.getElementById('search-name').value.trim();
            document.querySelectorAll('.highlight-seat').forEach(e => e.classList.remove('highlight-seat'));
            const banner = document.getElementById('search-result-banner');
            if (n === "76" || m.includes("박철완")) {
                document.getElementById('commander-card').classList.add('highlight-seat');
                document.getElementById('commander-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
                banner.className = "p-3 rounded-lg text-sm text-center font-semibold bg-emerald-500/20 text-emerald-300";
                banner.innerHTML = `[76번 박철완] 위치: <strong>단상 앞 지휘자</strong>`; banner.classList.remove('hidden'); return;
            }
            const match = traineesData.find(t => (n && t.number === n) || (m && t.name.includes(m)));
            if (match) {
                const target = document.getElementById(`seat-${match.echelon}-${match.col}-${match.row}`);
                target.classList.add('highlight-seat'); target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                banner.className = "p-3 rounded-lg text-sm text-center font-semibold bg-emerald-500/20 text-emerald-300";
                banner.innerHTML = `[${match.number}번 ${match.name}] 위치: <strong>제${match.echelon}제대 ${match.col}열 ${match.row}행</strong>`; banner.classList.remove('hidden');
            }
        }
        function resetSearch() { document.getElementById('search-number').value = ''; document.getElementById('search-name').value = ''; document.querySelectorAll('.highlight-seat').forEach(e => e.classList.remove('highlight-seat')); document.getElementById('search-result-banner').classList.add('hidden'); }

        function checkAdminPassword() { if (prompt("관리자 비밀번호:") === ADMIN_PW) openAdminModal(); else alert("불일치"); }
        function openAdminModal() {
            document.getElementById('modal-content').innerHTML = `
                <div class='flex justify-between items-center mb-3 border-b border-slate-800 pb-2'><h3 class='text-white font-bold text-base'>명단 관리자 설정</h3><button onclick='toggleModal("detail-modal")' class='text-slate-400'>&times;</button></div>
                <div class='flex justify-between mb-2'><button onclick='exportCSV()' class='bg-slate-700 text-[11px] px-2.5 py-1 rounded text-white'>CSV 다운로드</button><button onclick='document.getElementById("csvFileInput").click()' class='bg-blue-600 text-[11px] px-2.5 py-1 rounded text-white'>CSV 업로드</button></div>
                <div class='max-h-52 overflow-y-auto space-y-1 mb-4 pr-1 custom-scrollbar'>
                    ${traineesData.map((t, i) => `
                        <div class='flex gap-1 items-center'>
                            <select id='e-${i}' class='w-12 bg-slate-800 p-1 text-[10px] rounded text-white'><option value='1' ${t.echelon===1?'selected':''}>1제대</option><option value='2' ${t.echelon===2?'selected':''}>2제대</option></select>
                            <input class='w-8 bg-slate-800 p-1 text-[10px] rounded text-white' value='${t.col}' id='c-${i}'>
                            <input class='w-8 bg-slate-800 p-1 text-[10px] rounded text-white' value='${t.row}' id='r-${i}'>
                            <input class='w-12 bg-slate-800 p-1 text-[10px] rounded text-white' value='${t.number}' id='n-${i}'>
                            <input class='flex-1 bg-slate-800 p-1 text-[10px] rounded text-white' value='${t.name}' id='m-${i}'>
                            <button onclick='del(${i})' class='bg-rose-900 px-2 text-[10px] text-white'>X</button>
                        </div>
                    `).join('')}
                </div>
                <button onclick='add()' class='w-full bg-slate-800 text-slate-200 py-2 rounded-lg text-xs mb-2'>+ 인원 추가</button>
                <button onclick='downloadUpdatedHTML()' class='w-full bg-emerald-600 text-white font-bold py-2 rounded-lg text-xs'>배포용 index.html 다운로드</button>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function syncFormValues() {
            traineesData.forEach((_, i) => {
                if (document.getElementById('e-'+i)) {
                    traineesData[i].echelon = parseInt(document.getElementById('e-'+i).value);
                    traineesData[i].col = parseInt(document.getElementById('c-'+i).value);
                    traineesData[i].row = parseInt(document.getElementById('r-'+i).value);
                    traineesData[i].number = document.getElementById('n-'+i).value;
                    traineesData[i].name = document.getElementById('m-'+i).value;
                }
            });
        }
        function del(i) { syncFormValues(); traineesData.splice(i, 1); openAdminModal(); renderBoard(); }
        function add() { syncFormValues(); traineesData.push({ echelon: 1, col: 1, row: 1, number: "0", name: "신규", note: "" }); openAdminModal(); renderBoard(); }

        function downloadUpdatedHTML() {
            syncFormValues();
            const e1Str = traineesData.filter(t => t.echelon === 1).map(t => `{ col: ${t.col}, row: ${t.row}, number: "${t.number}", name: "${t.name}", note: "${t.note||''}" }`).join(', ');
            const e2Str = traineesData.filter(t => t.echelon === 2).map(t => `{ col: ${t.col}, row: ${t.row}, number: "${t.number}", name: "${t.name}", note: "${t.note||''}" }`).join(', ');
            
            let html = document.documentElement.outerHTML;
            html = html.replace(/const echelon1Data = \[[\s\S]*?\];/, `const echelon1Data = [\n            ${e1Str}\n        ];`);
            html = html.replace(/const echelon2Data = \[[\s\S]*?\];/, `const echelon2Data = [\n            ${e2Str}\n        ];`);
            
            const blob = new Blob(["<!DOCTYPE html>\n" + html], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'index.html'; link.click();
            alert("다운로드 되었습니다. 이 파일을 배포 서버에 업로드하세요.");
        }

        function exportCSV() {
            syncFormValues(); let csv = "\uFEFF제대,열,행,교번,성명\n" + traineesData.map(t => `${t.echelon},${t.col},${t.row},${t.number},${t.name}`).join("\n");
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = '명단.csv'; link.click();
        }
        function importCSV(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const lines = event.target.result.split(/\r?\n/).slice(1);
                traineesData = lines.filter(l => l.trim()).map(l => { const [e, c, r, n, m] = l.split(','); return { echelon: parseInt(e)||1, col: parseInt(c)||1, row: parseInt(r)||1, number: n||"0", name: m||"신규", note: "" }; });
                openAdminModal(); renderBoard();
            };
            reader.readAsText(e.target.files[0], 'euc-kr');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function openDetailModal(p) { alert(`[${p.number}번 ${p.name}] 제${p.echelon}제대 ${p.col}열 ${p.row}행`); }
        function openCommanderModal() { alert("[76번 박철완] 단상 앞 지휘자"); }
        function copyCurrentUrl() { navigator.clipboard.writeText(window.location.href); alert("주소가 복사되었습니다."); }

        window.onload = renderBoard;
    </script>
